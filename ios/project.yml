# Xcode project definition. Generate the .xcodeproj with:  brew install xcodegen && xcodegen generate
name: OneBPM
options:
  bundleIdPrefix: org.onebpm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OneBPM:
    type: application
    platform: iOS
    sources:
      - OneBPM
    info:
      path: OneBPM/Info.plist
      properties:
        CFBundleDisplayName: 1BPM
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_NAME: OneBPM
        PRODUCT_BUNDLE_IDENTIFIER: org.onebpm.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  OneBPMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OneBPMTests
    dependencies:
      - target: OneBPM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OneBPM:
    build:
      targets:
        OneBPM: all
        OneBPMTests: [test]
    test:
      targets:
        - OneBPMTests
